# Exhausting Combat configuration
#
# Read when the game starts and rewritten when settings change in the in-game menu.
# Every setting lists what it does, its default and its valid range. Values outside the
# range are clamped; missing or invalid values fall back to the default and are reported
# in the SKSE log (Documents/My Games/Skyrim Special Edition/SKSE/styyx-stamina-combat.log).
# Costs are in stamina points; drains marked 'per second' scale with frame time.

[General]

# Log detail: 0 trace, 1 debug, 2 info, 3 warnings, 4 errors, 5 critical, 6 off.
# 1 logs every attack, cast, shot and jump with its inputs; 0 also logs per-frame drains.
# 0 and 1 write large logs.
# Default: 2 | Valid: 0 to 6
iLogLevel = 2

[Stamina.Player]

# On: only equipped items count as carried weight for jump, sprint, swim and run costs.
# Off: the whole inventory weight counts.
# Default: true | Valid: true or false
bPlayerEquippedWeightOnly = true

# On: this mod charges no stamina outside combat.
# Default: true | Valid: true or false
bPlayerCombatOnly = true

# Base stamina cost of a melee attack or bash.
# Then scaled by item weight (x1 to x2), Attack Mult, Power Attack Mult, skill scaling and perks.
# Unarmed attacks add no cost (the vanilla cost applies).
# Default: 9.0 | Valid: 0.0 to 20.0
fPlayerStaminaCostAttack = 9.0

# Multiplier applied to every melee attack and bash cost.
# Default: 1.414 | Valid: 0.0 to 20.0
fPlayerStaminaMultAttack = 1.414

# Additional multiplier for power attacks only, applied on top of Attack Mult.
# Default: 2.0 | Valid: 0.0 to 20.0
fPlayerStaminaMultPAttack = 2.0

# Stamina per second while sprinting on foot.
# Raised by carried weight: x1.5 at full carry weight, more when over-encumbered.
# Default: 7.0 | Valid: 0.0 to 20.0
fPlayerStaminaCostSprint = 7.0

# Stamina per second while swimming.
# Raised by carried weight: x1.5 at full carry weight, more when over-encumbered.
# Default: 5.0 | Valid: 0.0 to 20.0
fPlayerStaminaCostSwim = 5.0

# Stamina per second while moving in sneak mode.
# Reduced by Sneak skill scaling.
# Default: 2.0 | Valid: 0.0 to 20.0
fPlayerStaminaCostSneak = 2.0

# Stamina per second while running (not sprinting, sneaking or swimming).
# Raised by carried weight: x1.5 at full carry weight, more when over-encumbered.
# Default: 1.0 | Valid: 0.0 to 20.0
fPlayerStaminaCostRunning = 1.0

# Base stamina cost per spell cast (per second for concentration spells).
# The spell's magicka cost adds up to 25 more; reduced by the spell school's skill scaling.
# 0 disables spell costs.
# Default: 10.0 | Valid: 0.0 to 20.0
fPlayerStaminaCostCast = 10.0

# Multiplier for concentration spells only, applied on top of the casting cost per second.
# 1.0 = a second of concentration costs the same as one fire-and-forget cast.
# Default: 1.0 | Valid: 0.0 to 20.0
fPlayerStaminaMultConcentration = 1.0

# Stamina per second while holding a drawn bow without zooming in.
# Also drains during the whole crossbow reload animation.
# Default: 5.0 | Valid: 0.0 to 20.0
fPlayerStaminaCostBowDrain = 5.0

# Stamina cost per arrow or bolt fired, reduced by Archery skill scaling.
# The shot fails if it would leave the shooter with no stamina.
# Default: 10.0 | Valid: 0.0 to 20.0
fPlayerStaminaCostBow = 10.0

# Stamina cost per jump.
# Raised by carried weight: x1.5 at full carry weight, more when over-encumbered.
# Default: 10.0 | Valid: 0.0 to 20.0
fPlayerStaminaCostJump = 10.0

# Stamina per second a horse pays while sprinting.
# A ridden horse uses its rider's settings and perks.
# Default: 7.0 | Valid: 0.0 to 20.0
fPlayerStaminaCostSprintHorse = 7.0

[Stamina.NPC]

# On: only equipped items count as carried weight for jump, sprint, swim and run costs.
# Off: the whole inventory weight counts.
# Default: true | Valid: true or false
bNPCEquippedWeightOnly = true

# On: this mod charges no stamina outside combat.
# Default: true | Valid: true or false
bNPCCombatOnly = true

# On: an NPC whose maximum stamina is lower than the cost of an attack, spell or bow shot performs it for free.
# Many vanilla NPCs have 0 stamina and could otherwise never act.
# Default: true | Valid: true or false
bExcludeNoStaminaNPCs = true

# Base stamina cost of a melee attack or bash.
# Then scaled by item weight (x1 to x2), Attack Mult, Power Attack Mult, skill scaling and perks.
# Unarmed attacks add no cost (the vanilla cost applies).
# Default: 9.0 | Valid: 0.0 to 20.0
fNPCStaminaCostAttack = 9.0

# Multiplier applied to every melee attack and bash cost.
# Default: 1.414 | Valid: 0.0 to 20.0
fNPCStaminaMultAttack = 1.414

# Additional multiplier for power attacks only, applied on top of Attack Mult.
# Default: 2.0 | Valid: 0.0 to 20.0
fNPCStaminaMultPAttack = 2.0

# Stamina per second while sprinting on foot.
# Raised by carried weight: x1.5 at full carry weight, more when over-encumbered.
# Default: 7.0 | Valid: 0.0 to 20.0
fNPCStaminaCostSprint = 7.0

# Stamina per second while swimming.
# Raised by carried weight: x1.5 at full carry weight, more when over-encumbered.
# Default: 5.0 | Valid: 0.0 to 20.0
fNPCStaminaCostSwim = 5.0

# Stamina per second while moving in sneak mode.
# Reduced by Sneak skill scaling.
# Default: 2.0 | Valid: 0.0 to 20.0
fNPCStaminaCostSneak = 2.0

# Stamina per second while running (not sprinting, sneaking or swimming).
# Raised by carried weight: x1.5 at full carry weight, more when over-encumbered.
# Default: 1.0 | Valid: 0.0 to 20.0
fNPCStaminaCostRunning = 1.0

# Base stamina cost per spell cast (per second for concentration spells).
# The spell's magicka cost adds up to 25 more; reduced by the spell school's skill scaling.
# 0 disables spell costs.
# Default: 10.0 | Valid: 0.0 to 20.0
fNPCStaminaCostCast = 10.0

# Multiplier for concentration spells only, applied on top of the casting cost per second.
# 1.0 = a second of concentration costs the same as one fire-and-forget cast.
# Default: 1.0 | Valid: 0.0 to 20.0
fNPCStaminaMultConcentration = 1.0

# Stamina per second while holding a drawn bow without zooming in.
# Also drains during the whole crossbow reload animation.
# Default: 5.0 | Valid: 0.0 to 20.0
fNPCStaminaCostBowDrain = 5.0

# Stamina cost per arrow or bolt fired, reduced by Archery skill scaling.
# The shot fails if it would leave the shooter with no stamina.
# Default: 10.0 | Valid: 0.0 to 20.0
fNPCStaminaCostBow = 10.0

# Stamina cost per jump.
# Raised by carried weight: x1.5 at full carry weight, more when over-encumbered.
# NPC jumps may not reach the hooked function, so this may have no effect (untested).
# Default: 10.0 | Valid: 0.0 to 20.0
fNPCStaminaCostJump = 10.0

# Stamina per second a horse pays while sprinting.
# A ridden horse uses its rider's settings and perks.
# Applies to horses ridden by NPCs and to riderless horses (untested).
# Default: 7.0 | Valid: 0.0 to 20.0
fNPCStaminaCostSprintHorse = 7.0

[Stamina.ActorValue]

